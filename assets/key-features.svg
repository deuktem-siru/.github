<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" role="img" aria-labelledby="title desc">
  <title id="title">득템시루 핵심 기능</title>
  <desc id="desc">가까운 마감 상품 찾기: 지도 탐색 · 상품 확인 · 찜, 상품 등록 · 가격·재고 관리. 주문하고 시루로 결제: 장바구니 · 시루 결제 시뮬레이션, 주문 접수 · 주문 상태 관리. 매장에서 상품 받기: 픽업 코드·QR 제시 · 리뷰 작성, 픽업 검증 · 매출 확인 · 정산 신청.</desc>
  <style>
